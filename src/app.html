<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Series" />
    <meta name="application-name" content="Series Tracker" />
    <!-- Theme bootstrap — runs synchronously before SvelteKit hydrates so
         the html class is stamped before first paint. Reads a localStorage
         mirror (written by $lib/theme.svelte.ts on every change) since IDB
         is async. New users (no saved pref) default to dark — light is
         still experimental, so we don't let `prefers-color-scheme: light`
         flip them in unannounced. Users who explicitly pick "auto" do
         consult the media query; everyone else gets the theme they last
         saved. The same script also seeds the meta theme-color so
         iOS / Android PWA chrome blends with the bg from the very first
         frame. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("series-tracker:theme");
          var resolved;
          if (pref === "light" || pref === "dark") {
            resolved = pref;
          } else if (pref === "auto") {
            resolved = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          } else {
            resolved = "dark";
          }
          document.documentElement.classList.add("theme-" + resolved);
          var meta = document.createElement("meta");
          meta.name = "theme-color";
          meta.content = resolved === "light" ? "#f7f1e5" : "#141b21";
          document.head.appendChild(meta);
        } catch (e) {
          document.documentElement.classList.add("theme-dark");
        }
      })();
    </script>
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
    <link rel="icon" href="%sveltekit.assets%/logo.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon-180x180.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
